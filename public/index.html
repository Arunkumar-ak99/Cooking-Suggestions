<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="description" content="What's in My Fridge - Smart Recipe Finder" />
    <title>What's in My Fridge?</title>
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&').map(function (value) {
            return value.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
